services:
  postgres:
    image: postgres:16-alpine
    container_name: courtsphere-postgres
    environment:
      POSTGRES_DB: courtsphere
      POSTGRES_PASSWORD: "123456"
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courtsphere"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - courtsphere_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: courtsphere-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/courtsphere?schema=public
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: courtsphere_access_secret_1234567890
      JWT_ACCESS_EXPIRES_IN: 1h
      MOCK_PAYMENT_SECRET: courtsphere_mock_payment_secret_123456
      PAYMENT_GATEWAY: mock
      FRONTEND_BASE_URL: http://localhost:5173
      BACKEND_PUBLIC_BASE_URL: http://localhost:3000
      MOMO_ENDPOINT: https://test-payment.momo.vn/v2/gateway/api/create
      MOMO_PARTNER_CODE: MOMO
      MOMO_ACCESS_KEY: F8BBA842ECF85
      MOMO_SECRET_KEY: K951B6PE1waDMi640xX08PD3vg6EkVlz
      MOMO_PARTNER_NAME: CourtSphere
      MOMO_STORE_ID: CourtSphereStore
      MOMO_REDIRECT_URL: http://localhost:5173/payments/momo-return
      MOMO_IPN_URL: http://localhost:3000/api/payments/callback/momo
      MOMO_REQUEST_TYPE: payWithMethod
      MOMO_LANG: vi
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - courtsphere_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: courtsphere-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"

volumes:
  courtsphere_postgres_data:
  courtsphere_uploads:
